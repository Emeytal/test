<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AAPL Options</title>
    <style>
        body { font-family: sans-serif; margin: 0; }
        .tab-container { overflow: hidden; border: 1px solid #ccc; background: #f1f1f1; }
        .tab-button { background-color: inherit; float: left; border: none; outline: none; cursor: pointer; padding: 14px 16px; transition: 0.3s; font-size: 17px; }
        .tab-button:hover { background-color: #ddd; }
        .tab-button.active { background-color: #ccc; }
        .tab-content { display: none; padding: 20px; border: 1px solid #ccc; border-top: none; }
        .tab-content.active { display: block; }
        h1 { padding: 10px; margin: 0; background-color: #2c3e50; color: white; text-align: center;}
        h3 { margin-top: 0; }

        /* Table Styles */
        .options-table { border-collapse: collapse; width: 100%; margin-bottom: 20px; font-size: 0.9em; }
        .options-table th, .options-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .options-table th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>AAPL Options Chain Viewer</h1>

    <div class="tab-container">
        {% for item in options_data %}
            <button class="tab-button {% if loop.first %}active{% endif %}" onclick="openTab(event, '{{ item.date }}')">{{ item.date }}</button>
        {% endfor %}
    </div>

    {% for item in options_data %}
    <div id="{{ item.date }}" class="tab-content {% if loop.first %}active{% endif %}">
        <h3>Calls for {{ item.date }}</h3>
        {{ item.calls_html | safe }}
        
        <h3>Puts for {{ item.date }}</h3>
        {{ item.puts_html | safe }}
    </div>
    {% endfor %}

    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;

            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }

            tablinks = document.getElementsByClassName("tab-button");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }

            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }

        // The first tab is set to active via class in HTML by Jinja.
        // If a specific tab needs to be opened by default via JS,
        // you could use: document.getElementById("defaultOpenTabButtonId").click();
        // But for this setup, server-side rendering of 'active' class is preferred.
    </script>
</body>
</html>
